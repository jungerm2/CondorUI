name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: Ruff format check
        run: uv run ruff format --check app tests
      - name: Ruff lint
        run: uv run ruff check app tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: Mypy
        run: uv run mypy app run.py

  test:
    # Playwright 1.60 can't --with-deps on ubuntu 26.04 runners; 24.04 is supported
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
      - name: Pytest
        run: uv run pytest -q
