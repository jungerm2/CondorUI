{% extends "base.html" %}

{% block title %}History — Condor Web UI{% endblock %}

{% block content %}
<section class="tab-panel active" id="panel-history">
    <div class="page-header">
        <h1>Job History</h1>
        <div class="header-actions">
            <input type="text" class="search-input" id="history-search" placeholder="Search history...">
            <select class="filter-select" id="history-status-filter">
                <option value="">All Statuses</option>
                <option value="1">Idle</option>
                <option value="2">Running</option>
                <option value="3">Removed</option>
                <option value="4">Completed</option>
                <option value="5">Held</option>
                <option value="6">Transferring</option>
            </select>
            <select class="filter-select" id="history-limit">
                <option value="50">Last 50</option>
                <option value="100" selected>Last 100</option>
                <option value="200">Last 200</option>
                <option value="500">Last 500</option>
            </select>
            <button class="btn btn-ghost" id="refresh-history-btn" title="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <polyline points="23,4 23,10 17,10" />
                    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
                </svg>
            </button>
        </div>
    </div>
    <div class="card">
        <div class="table-controls" style="padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="selection-count">0 selected</span>
            <button class="btn btn-ghost btn-sm" id="history-delete-btn" disabled style="border: 1px solid var(--border-color);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <polyline points="3,6 5,6 21,6" />
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
                </svg>
                Delete
            </button>
            <button class="btn btn-ghost btn-sm" id="history-edit-btn" disabled style="border: 1px solid var(--border-color);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
                Edit
            </button>
            <button class="btn btn-ghost btn-sm" id="history-release-btn" disabled style="border: 1px solid var(--border-color);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
                Release
            </button>
        </div>
        <div class="table-container">
            <table class="data-table" id="history-table">
                <thead>
                    <tr>
                        <th style="width: 36px; text-align: center;">
                            <input type="checkbox" id="history-select-all" title="Select all">
                        </th>
                        <th class="sortable" data-sort="ClusterId">ID <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="Owner">Owner <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="Cmd">Command <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="JobStatus">Status <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="ExitCode">Exit Code <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="QDate">Submitted <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="CompletionDate">Completed <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="RemoteWallClockTime">Wall Time <span class="sort-arrow"></span></th>
                        <th class="sortable" data-sort="Resources">Resources <span class="sort-arrow"></span></th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr class="empty-row">
                        <td colspan="10">Click refresh to load history</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/js/history.js"></script>
{% endblock %}
