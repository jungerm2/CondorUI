{% extends "base.html" %}

{% block title %}Templates — Condor Web UI{% endblock %}

{% block content %}
<section class="tab-panel active" id="panel-templates">
    <div class="page-header">
        <h1>Submit Templates</h1>
        <div class="header-actions">
            <button class="btn btn-primary" id="save-template-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                    height="16">
                    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
                    <polyline points="17,21 17,13 7,13 7,21" />
                    <polyline points="7,3 7,8 15,8" />
                </svg>
                Save Current Form
            </button>
        </div>
    </div>
    <div class="templates-grid" id="templates-grid">
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="64" height="64">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14,2 14,8 20,8" />
            </svg>
            <p>No templates saved yet</p>
            <p class="hint">Build a submit description and save it as a template for reuse</p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/js/templates.js"></script>
{% endblock %}
