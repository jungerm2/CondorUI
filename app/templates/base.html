<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web UI for submitting and monitoring HTCondor jobs">
    <title>{% block title %}Condor Web UI{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            var theme = localStorage.getItem('theme');
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            if (theme === 'light') {
                document.documentElement.classList.add('light-theme');
            }
            // Restore sidebar state
            var sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (sidebarCollapsed) {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        })();
    </script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="logo" href="/" aria-label="Condor Web UI dashboard">
                <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor" fill-opacity="0.10"
                        stroke="currentColor" stroke-opacity="0.24" />
                    <path d="M6 20c4.5-1 7.5-4 10-9 2.5 5 5.5 8 10 9" stroke="currentColor"
                        stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
                    <circle cx="6" cy="20" r="2" fill="currentColor" />
                    <circle cx="11" cy="17" r="1.6" fill="currentColor" />
                    <circle cx="16" cy="11" r="2.2" fill="currentColor" />
                    <circle cx="21" cy="17" r="1.6" fill="currentColor" />
                    <circle cx="26" cy="20" r="2" fill="currentColor" />
                </svg>
                <span class="logo-text">Condor<span class="logo-text-suffix"> UI</span></span>
            </a>
            <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" type="button"
                title="Collapse sidebar" aria-label="Collapse sidebar" aria-controls="sidebar"
                aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
        </div>
        <ul class="nav-links">
            <!-- Jobs Section -->
            <li class="nav-section" id="nav-section-jobs">
                <div class="nav-section-header" data-section="jobs">
                    <span class="nav-section-title">Jobs</span>
                    <span class="nav-section-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6,9 12,15 18,9" />
                        </svg>
                    </span>
                </div>
                <ul class="nav-section-content">
                    <li>
                        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="7" height="7" rx="1" />
                                <rect x="14" y="3" width="7" height="7" rx="1" />
                                <rect x="3" y="14" width="7" height="7" rx="1" />
                                <rect x="14" y="14" width="7" height="7" rx="1" />
                            </svg>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/submit" class="nav-link {% if active_page == 'submit' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            <span>Submit Job</span>
                        </a>
                    </li>
                </ul>
            </li>
            <!-- Data Section -->
            <li class="nav-section" id="nav-section-data">
                <div class="nav-section-header" data-section="data">
                    <span class="nav-section-title">Data</span>
                    <span class="nav-section-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6,9 12,15 18,9" />
                        </svg>
                    </span>
                </div>
                <ul class="nav-section-content">
                    <li>
                        <a href="/files" class="nav-link {% if active_page == 'files' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                                <polyline points="14,2 14,8 20,8" />
                                <line x1="16" y1="13" x2="8" y2="13" />
                                <line x1="16" y1="17" x2="8" y2="17" />
                            </svg>
                            <span>Input Files</span>
                        </a>
                    </li>
                    <li>
                        <a href="/executables" class="nav-link {% if active_page == 'executables' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                                <polyline points="14,2 14,8 20,8" />
                                <line x1="9" y1="12" x2="15" y2="12" />
                                <line x1="12" y1="9" x2="12" y2="15" />
                            </svg>
                            <span>Executables</span>
                        </a>
                    </li>
                    <li>
                        <a href="/output-files" class="nav-link {% if active_page == 'output-files' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                                <polyline points="7,10 12,15 17,10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            <span>Output Files</span>
                        </a>
                    </li>
                </ul>
            </li>
            <!-- System Section -->
            <li class="nav-section" id="nav-section-system">
                <div class="nav-section-header" data-section="system">
                    <span class="nav-section-title">System</span>
                    <span class="nav-section-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6,9 12,15 18,9" />
                        </svg>
                    </span>
                </div>
                <ul class="nav-section-content">
                    <li>
                        <a href="/templates" class="nav-link {% if active_page == 'templates' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                                <polyline points="14,2 14,8 20,8" />
                            </svg>
                            <span>Templates</span>
                        </a>
                    </li>
                    <li>
                        <a href="/containers" class="nav-link {% if active_page == 'containers' %}active{% endif %}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />
                                <polyline points="3.27,6.96 12,12.01 20.73,6.96" />
                                <line x1="12" y1="22.08" x2="12" y2="12" />
                            </svg>
                            <span>Containers</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
            <button class="sidebar-theme-btn" id="theme-toggle" type="button"
                title="Switch to light mode" aria-label="Dark mode. Switch to light mode">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
                <span class="theme-label">Dark mode</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Shared file preview modal: opened from the output files, input
         files, executables, and containers pages via openFilePreview() -->
    <div class="modal-overlay" id="file-preview-modal">
        <div class="modal" style="max-width: 760px;">
            <div class="modal-header">
                <h2 id="file-preview-filename" style="font-size: 1rem; word-break: break-all;">Preview</h2>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <a href="#" id="file-preview-download" class="btn btn-ghost btn-sm" download>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                            <polyline points="7,10 12,15 17,10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Download
                    </a>
                    <button class="btn btn-ghost btn-sm modal-close-btn" data-modal="file-preview-modal" style="padding: 4px 8px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="file-preview-body" style="max-height: 70vh; overflow: auto;">
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
