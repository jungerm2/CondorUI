[project]
name = "condor-webui"
version = "0.1.0"
description = "Web UI for submitting and monitoring HTCondor jobs"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.1.4",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "htcondor>=25.10.1",
]

[project.scripts]
condor-webui = "run:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.16",
    "mypy>=1.19",
]

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
# htcondor bindings ship no py.typed/stubs and the v1 fallback names don't exist here
module = ["htcondor", "htcondor2", "classad", "classad2"]
ignore_missing_imports = true
